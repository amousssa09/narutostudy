function ent(id){const m=MST.find(x=>x.id==id),js=J.filter(j=>j.ma==id).sort((a,b)=>a.r-b.r);
mo(m.e+' '+esc(m.n),`<p class="mu" style="margin-bottom:10px">Cumple la misión de cada técnica (mientras estudias) y paga para aprenderla. Solo una misión de maestro a la vez.</p>${js.map(j=>{const [tp,n,c]=mqf(j),kn=S.kn.includes(j.id),lk=S.lv<j.r,q=S.mm&&S.mm.j==j.id?S.mm:null,dn=q&&q.h>=n;
return `<div class="mi" style="margin-bottom:8px"><div class="rg"><b style="flex:1">${esc(j.n)}</b><span class="mu">${TY[j.t]}</span></div><div class="mu">${j.t=='gen'?'Congela '+j.f+'s':'Poder '+j.p}${j.c?' · '+j.c+' chakra':''} · Nv.${j.r}</div>${kn?'<div class="mu">✅ Aprendida</div>':lk?`<div class="mu">🔒 Se desbloquea en el nivel ${j.r}</div>`:`<div class="mu" style="margin:4px 0">🎯 ${ob(tp,n)} · 💰 ${c} ryō</div>${q?`${bar(q.h/n*100,'var(--or)')}<div class="mu">${Math.min(q.h,n)}/${n}</div>${dn?`<button class="btn" ${S.ryo<c?'disabled':''} onclick="lrn('${j.id}','${id}')">Aprender · ${c} ryō</button>`:`<button onclick="S.mm=null;save();render();ent('${id}')">Abandonar</button>`}`:`<button class="btn" ${S.mm?'disabled':''} onclick="S.mm={j:'${j.id}',h:0};save();render();ent('${id}')">Aceptar misión</button>`}`}</div>`}).join('')}`)}
function lrn(jid,mid){const j=J.find(x=>x.id==jid),[tp,n,c]=mqf(j);if(!S.mm||S.mm.j!=jid||S.mm.h<n||S.ryo<c)return;S.ryo-=c;S.kn.push(jid);if(S.eq.length<6)S.eq.push(jid);S.mm=null;save();T('🎓 ¡Aprendiste '+j.n+'!');render();ent(mid)}
// ===== Gestión (tareas, fechas, notas) =====
const dl_=d=>Math.round((new Date(d+'T00:00')-new Date(new Date().toDateString()))/864e5),
dtx=n=>n<0?'pasó hace '+-n+' d':n==0?'¡HOY!':n==1?'mañana':'en '+n+' días',
dcl=n=>n<=3?'var(--rd)':n<=7?'var(--or)':'var(--mu)',
fd=d=>new Date(d+'T00:00').toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}),
EK={examen:'📝',proyecto:'🧩',entrega:'📦',otro:'📌'},
evs=()=>S.gs.ev.map((e,i)=>({...e,i,n:dl_(e.d)})).sort((a,b)=>a.d<b.d?-1:1),
tks=()=>S.gs.tk.map((t,i)=>({...t,i,n:t.d?dl_(t.d):null})).sort((a,b)=>(a.x-b.x)||((a.d||'9')<(b.d||'9')?-1:1));
function gdash(){const ev=evs().filter(e=>e.n>=0).slice(0,4),tk=tks().filter(t=>!t.x).slice(0,4),nt=S.gs.nt.filter(n=>n.r&&dl_(n.r)<=7);
if(!ev.length&&!tk.length&&!nt.length)return '';
return `<div class="card"><div class="ct">📅 Tu semana</div>${ev.map(e=>`<div class="rg">${EK[e.k]} <b>${esc(e.t)}</b> <span style="color:${dcl(e.n)};font-weight:700">${dtx(e.n)}</span> <span class="mu">${fd(e.d)}</span></div>`).join('')}${tk.map(t=>`<div class="rg">${t.k=='proyecto'?'🧩':'📚'} ${esc(t.t)}${t.d?` <span style="color:${dcl(t.n)};font-weight:700">${dtx(t.n)}</span>`:''}</div>`).join('')}${nt.map(n=>`<div class="rg">⏰ ${esc(n.t)} <span style="color:${dcl(dl_(n.r))};font-weight:700">${dtx(dl_(n.r))}</span></div>`).join('')}<button style="margin-top:6px" onclick="go('g')">Abrir Gestión →</button></div>`}
function gest(){const ev=evs(),tk=tks(),nt=S.gs.nt.map((n,i)=>({...n,i}));
$('#v').innerHTML=`<div class="ph"><div><div class="pt">📅 Gestión</div><div class="ps">Tus tareas, fechas y notas (fuera del juego)</div></div><div class="rg"><button onclick="mEv()">+ Fecha</button><button onclick="mTk()">+ Tarea</button><button class="btn" onclick="mNt()">+ Nota</button></div></div>
<div class="two"><div><div class="card"><div class="ct">📌 Fechas importantes</div>${ev.map(e=>`<div class="rg"><span style="flex:1">${EK[e.k]} <b>${esc(e.t)}</b><div class="mu">${fd(e.d)} · <span style="color:${dcl(e.n)};font-weight:700">${dtx(e.n)}</span></div></span><button onclick="dEv(${e.i})">🗑️</button></div>`).join('')||'<p class="mu">Sin fechas. Añade un examen o una entrega.</p>'}</div>
<div class="card"><div class="ct">📝 Notas y recordatorios</div>${nt.map(n=>`<div class="mi" style="margin-bottom:8px"><div class="rg"><b style="flex:1">${esc(n.t)}</b><button onclick="dNt(${n.i})">🗑️</button></div><div class="mu" style="white-space:pre-wrap">${esc(n.c)}</div>${n.r?`<div class="mu" style="margin-top:4px;color:${dcl(dl_(n.r))}">⏰ ${fd(n.r)} · ${dtx(dl_(n.r))}</div>`:''}</div>`).join('')||'<p class="mu">Sin notas.</p>'}</div></div>
<div class="card"><div class="ct">✅ Tareas</div>${tk.map(t=>`<div class="rg"><input type="checkbox" style="width:auto" ${t.x?'checked':''} onchange="ttk(${t.i})"><span style="flex:1;${t.x?'opacity:.5;text-decoration:line-through':''}">${t.k=='proyecto'?'🧩':'📚'} <b>${esc(t.t)}</b><div class="mu">${t.k=='proyecto'?'Proyecto':'Clase'}${t.d?` · <span style="color:${t.x?'var(--mu)':dcl(t.n)}">${dtx(t.n)}</span>`:''}</div></span><button onclick="dTk(${t.i})">🗑️</button></div>`).join('')||'<p class="mu">Sin tareas.</p>'}${S.gs.tk.some(t=>t.x)?'<button style="margin-top:8px" onclick="clrTk()">Limpiar hechas</button>':''}</div></div>`}
const gw='width:min(460px,100%)',gv=()=>[$('#gt').value.trim(),$('#gk')&&$('#gk').value,$('#gd').value],gsv=()=>{save();cm();render()};
function mTk(){mo('✅ Nueva tarea',`<label>Título</label><input id="gt"><label>Tipo</label><select id="gk"><option value="clase">📚 Clase</option><option value="proyecto">🧩 Proyecto</option></select><label>Fecha límite (opcional)</label><input id="gd" type="date"><button class="btn big" onclick="aTk()">Añadir</button>`,gw)}
function mEv(){mo('📌 Nueva fecha',`<label>Título</label><input id="gt"><label>Tipo</label><select id="gk">${Object.keys(EK).map(k=>`<option value="${k}">${EK[k]} ${k[0].toUpperCase()+k.slice(1)}</option>`).join('')}</select><label>Fecha</label><input id="gd" type="date"><button class="btn big" onclick="aEv()">Añadir</button>`,gw)}
function mNt(){mo('📝 Nueva nota',`<label>Título</label><input id="gt"><label>Nota</label><textarea id="gc" rows="4"></textarea><label>Recordatorio (opcional)</label><input id="gd" type="date"><button class="btn big" onclick="aNt()">Guardar</button>`,gw)}
function aTk(){const[t,k,d]=gv();if(!t)return T('Pon un título');S.gs.tk.push({t,k,d,x:0});gsv()}
function aEv(){const[t,k,d]=gv();if(!t||!d)return T('Pon título y fecha');S.gs.ev.push({t,k,d});gsv()}
function aNt(){const[t,,d]=gv();if(!t)return T('Pon un título');S.gs.nt.push({t,c:$('#gc').value,r:d});gsv()}
function dTk(i){S.gs.tk.splice(i,1);gsv()}
function dEv(i){S.gs.ev.splice(i,1);gsv()}
function dNt(i){S.gs.nt.splice(i,1);gsv()}
function ttk(i){S.gs.tk[i].x=S.gs.tk[i].x?0:1;save();render()}
function clrTk(){S.gs.tk=S.gs.tk.filter(t=>!t.x);save();render()}
let pt='n';
function perf(){$('#v').innerHTML=ph('🥷 Perfil','Gestiona a tu ninja')+`<div class="rg" style="margin-bottom:14px">${[['n','👤 Ninja'],['s','📊 Estadísticas'],['e','🏋️ Entrenamiento']].map(([k,l])=>`<button class="${pt==k?'btn':''}" onclick="pt='${k}';render()">${l}</button>`).join('')}</div>`+({n:pn,s:pst,e:pen})[pt]()}
function pst(){return `<div class="card"><div class="ct">📊 Estadísticas</div><p class="mu" style="margin-bottom:10px">Puntos disponibles: <b style="color:var(--or2)">${S.sp}</b> (3 por nivel)</p>${[['hp','❤️ Vida','+5 vida máx.'],['ch','🔵 Chakra','+3 chakra máx.'],['nin','🌀 Ninjutsu','+4% de daño'],['tai','👊 Taijutsu','+4% de daño'],['gen','👁️ Genjutsu','+4% de daño y duración']].map(([k,l,d])=>`<div class="row"><span>${l} <span class="mu">${d}</span></span><span><b style="font-size:11px;margin-right:8px">${S.st[k]}</b><button class="btn" ${S.sp?'':'disabled'} onclick="sp_('${k}')">+</button></span></div>`).join('')}</div>`}
function sp_(k){if(S.sp<1)return;S.sp--;S.st[k]++;save();render()}
const MXL=5,tcost=(j,l)=>Math.round((60+j.p*3)*l);
function pen(){return `<div class="card"><div class="ct">🏋️ Entrenamiento</div><p class="mu" style="margin-bottom:8px">Sube el nivel de tus jutsus con ryō (máx. ${MXL}): +12% de poder (o de duración) por nivel.</p>${S.kn.map(id=>J.find(x=>x.id==id)).map(j=>{const l=S.jl[j.id]||1;return `<div class="rg"><span style="flex:1"><b>${j.n}</b> <span class="mu">${TY[j.t]}</span><div class="mu">Nivel ${l}/${MXL}</div></span>${l>=MXL?'<span class="mu">MÁX.</span>':`<button class="btn" ${S.ryo<tcost(j,l)?'disabled':''} onclick="trn('${j.id}')">Subir · ${tcost(j,l)} ryō</button>`}</div>`}).join('')}</div>`}
function trn(id){const j=J.find(x=>x.id==id),l=S.jl[id]||1;if(l>=MXL||S.ryo<tcost(j,l))return;S.ryo-=tcost(j,l);S.jl[id]=l+1;save();render()}
function pn(){const b=bo(),lk=J.filter(j=>!S.kn.includes(j.id)&&okj(j));
return `<div class="two"><div><div class="card"><div class="ct">Ninja</div><div style="font-size:64px;text-align:center">${S.av}</div>
<label>Nombre</label><input value="${esc(S.name)}" onchange="S.name=this.value.trim()||'Ninja';save()">
<label>Avatar</label><div class="rg">${['🥷','🦊','🐸','🐍','👁️','🌀','🍃','🔥'].map(a=>`<button onclick="S.av='${a}';save();render()">${a}</button>`).join('')}</div>
<label>Estadísticas</label>${rw(rk()+' · Nv.'+S.lv,S.xp+'/'+need()+' XP')}${rw('Vida / Chakra',mxHp()+' / '+mxCh())}</div>
<div class="card"><div class="ct">💾 Partida</div><div class="rg"><button class="btn" onclick="expo()">📤 Exportar</button><input type="file" accept=".json" onchange="impo(this)"></div><p class="mu">Importar sustituye tu partida actual.</p></div></div>
<div><div class="card"><div class="ct">🧬 Linaje shinobi (fijo)</div>${rasgos()}${rw('Bonus','Vida +'+b.hp+'% · Chakra +'+b.ch+'% · Poder +'+b.pw+'%')}${b.t?rw('Tiempo del rival','+'+b.t+' s'):''}${b.fc?rw('Tolerancia flashcard','+'+b.fc+'%'):''}</div>
<div class="card"><div class="ct">Jutsus (equipados ${S.eq.length}/6)</div>${S.kn.map(id=>J.find(x=>x.id==id)).map(j=>`<div class="rg"><span style="flex:1"><b>${j.n}</b> ${j.e?EL[j.e][0]:''}<div class="mu">${TY[j.t]} · ${S.u[j.id]||0} usos (+${Math.floor((S.u[j.id]||0)/10)*5}%)</div></span><button class="${S.eq.includes(j.id)?'btn':''}" onclick="tg('${j.id}')">${S.eq.includes(j.id)?'Equipado':'Equipar'}</button></div>`).join('')}${lk.length?`<div class="mu" style="margin-top:8px">Próximos: ${lk.map(j=>j.n+' (Nv.'+j.r+')').join(' · ')}</div>`:''}</div></div></div>`}
function tg(id){if(S.eq.includes(id)){if(S.eq.length>1)S.eq=S.eq.filter(x=>x!=id)}else if(S.eq.length<6)S.eq.push(id);else T('Máximo 6 jutsus');save();render()}
function expo(){dlf('narutostudy_'+S.name+'.json',JSON.stringify(S,null,2));T('📤 Partida exportada')}
function impo(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d||typeof d!='object'||!d.lv||!Array.isArray(d.tm))throw 0;S=Object.assign(DEF(),d);save();boot();T('📥 Partida importada')}catch(e){T('Archivo de partida no válido')}})}
boot();
</script></body></html>
